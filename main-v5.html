<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONLY FOR MY GIRL💛</title>
<meta name="theme-color" content="#FADED2">
<style>html,body{margin:0;min-height:100%;background:#FADED2}body{overflow-x:hidden}</style>
</head>
<body>
<script>
(async()=>{
  try{
    // Load the working birthday HTML directly from the Vercel serverless function.
    // This avoids the encoded-space rewrite path that was producing a blank page.
    const response=await fetch('/api/website?source=main-v5',{cache:'no-store'});
    if(!response.ok) throw new Error('Birthday page unavailable: '+response.status);
    const html=await response.text();
    if(!html || html.length<500) throw new Error('Birthday page response was empty');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('My Yellow failed to load:',error);
    document.body.innerHTML='<main style="min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:linear-gradient(145deg,#FCE7DC,#FADED2,#F8D8CC);font-family:system-ui,sans-serif;text-align:center;color:#4A2732"><div><div style="font-size:54px;margin-bottom:16px">💛</div><h1 style="margin:0 0 10px;font-size:28px">One second, my yellow...</h1><p style="margin:0;opacity:.72">The surprise is waking up. Please refresh once.</p></div></main>';
  }
})();
</script>
</body>
</html>
