<!doctype html>

<body>
<script>
(async()=>{
  try{
    const response=await fetch('/website%20file.html?v=myyellow-v5',{cache:'no-store'});
    if(!response.ok) throw new Error('Birthday page unavailable');
    let html=await response.text();
    const patch=`
<style id="myyellow-v5">
/* ===== MY YELLOW V5 — requested layout only ===== */
html,body{overflow-x:hidden!important}
#viewStory{position:relative;z-index:2}
#viewStory #world.my-v5-world{min-height:100svh!important}
#viewStory #world.my-v5-world>section.my-v5-page{display:none!important;position:relative!important;width:100%!important;min-height:100svh!important;height:100svh!important;max-height:none!important;overflow:hidden!important;padding:clamp(28px,5vh,64px) 16px clamp(92px,13vh,132px)!important;box-sizing:border-box!important}
#viewStory #world.my-v5-world>section.my-v5-page.my-v5-active{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;animation:myV5In .7s cubic-bezier(.2,.8,.2,1) both!important}
@keyframes myV5In{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.my-v5-page>.wrap{width:min(1180px,100%)!important;margin:0 auto!important;box-sizing:border-box!important}
.my-v5-page .my-v5-continue{position:absolute!important;left:50%!important;bottom:24px!important;transform:translateX(-50%)!important;z-index:500!important;min-width:220px!important;min-height:64px!important;padding:18px 38px!important;border:0!important;border-radius:999px!important;color:#fff!important;background:linear-gradient(135deg,#e9aab6,#ce8294)!important;box-shadow:0 18px 42px rgba(174,91,112,.34),inset 0 1px rgba(255,255,255,.35)!important;font:500 11px/1 Inter,system-ui,sans-serif!important;letter-spacing:.22em!important;text-transform:uppercase!important;cursor:pointer!important;transition:transform .28s ease,box-shadow .28s ease!important;animation:myV5Pulse 2.2s ease-in-out infinite!important}
.my-v5-page .my-v5-continue:hover{transform:translateX(-50%) translateY(-3px) scale(1.035)!important;box-shadow:0 25px 52px rgba(174,91,112,.42)!important}
.my-v5-page .my-v5-continue:active{transform:translateX(-50%) scale(.96)!important}
@keyframes myV5Pulse{0%,100%{box-shadow:0 18px 42px rgba(174,91,112,.30),inset 0 1px rgba(255,255,255,.35)}50%{box-shadow:0 23px 48px rgba(174,91,112,.42),0 0 0 8px rgba(220,151,165,.08),inset 0 1px rgba(255,255,255,.35)}}
.my-v5-back{position:fixed!important;top:12px!important;left:12px!important;z-index:99999!important;min-height:44px!important;padding:11px 17px!important;border:1px solid rgba(167,108,120,.25)!important;border-radius:999px!important;color:#5a3540!important;background:rgba(255,250,247,.92)!important;backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important;box-shadow:0 10px 26px rgba(99,59,71,.14)!important;font:500 10px/1 Inter,system-ui,sans-serif!important;letter-spacing:.12em!important;cursor:pointer!important}
/* 1. opening */
#hero.my-v5-page{padding-top:clamp(22px,4vh,48px)!important;text-align:center!important}
#hero.my-v5-page #heroInner{width:min(94vw,900px)!important;margin:auto!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important}
#hero.my-v5-page .hero-divider,#hero.my-v5-page .scroll-cue{display:none!important}
#hero.my-v5-page .hero-name{margin-bottom:clamp(18px,3vh,32px)!important}
#hero.my-v5-page .hero-divider+*{margin-top:0!important}
/* 2. love letter/photo: photo first, text second, everything centered */
.my-v5-love .split,.my-v5-quote .split{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:clamp(20px,3.2vh,34px)!important;text-align:center!important;width:100%!important}
.my-v5-love .art-col,.my-v5-quote .art-col{width:min(88vw,520px)!important;max-width:520px!important;order:0!important;margin:0 auto!important}
.my-v5-love .art-card,.my-v5-quote .art-card{width:100%!important;margin:0 auto!important}
.my-v5-love .stack,.my-v5-quote .stack{width:min(94vw,780px)!important;display:flex!important;flex-direction:column!important;align-items:center!important;text-align:center!important;margin:0 auto!important}
.my-v5-love .stack .body-copy,.my-v5-love .stack .pull-quote,.my-v5-quote .stack .body-copy{max-width:70ch!important;text-align:center!important}
/* 3. gift */
.my-v5-gift .wrap{height:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
.my-v5-gift #giftBlock{width:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important}
.my-v5-gift #giftStage{width:100%!important;height:clamp(350px,55vh,520px)!important;margin:0 auto!important;display:flex!important;align-items:center!important;justify-content:center!important}
.my-v5-gift .gift{transform:scale(1.22)!important;transform-origin:center!important}
@media(max-width:760px){.my-v5-gift #giftStage{height:clamp(330px,48vh,430px)!important}.my-v5-gift .gift{transform:scale(1.08)!important}}
/* 4. memory image */
.my-v5-memory .wrap{height:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
.my-v5-memory #memory{display:block!important;opacity:1!important;position:relative!important;width:100%!important}
.my-v5-memory #memory .memory-wrap{width:min(88vw,520px)!important;margin:0 auto!important}
.my-v5-memory #memoryCard{width:100%!important;margin:0 auto!important;transform:rotate(-1deg) scale(1.07)!important;transform-origin:center!important}
/* 5. proposal */
.my-v5-proposal .wrap{height:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
.my-v5-proposal #proposal{display:block!important;opacity:1!important;position:relative!important;width:100%!important}
.my-v5-proposal #proposal .q-script{font-size:clamp(48px,9vw,104px)!important;text-align:center!important}
.my-v5-proposal #proposal .arena{height:clamp(250px,34vh,330px)!important;margin-top:18px!important}
/* yes outcome: both pieces together, 4–6 seconds */
.my-v5-proposal #yesCard{z-index:997!important;width:min(88vw,620px)!important;top:57%!important}
.my-v5-proposal #cat{z-index:998!important}
.my-v5-proposal.my-v5-yes-show #yesCard{display:block!important}
@keyframes myV5YesCardIn{from{opacity:0;transform:translate3d(-50%,-50%,0) scale(.82) translateY(26px);filter:blur(9px)}to{opacity:1;transform:translate3d(-50%,-50%,0) scale(1);filter:none}}
.my-v5-yes-card-in{animation:myV5YesCardIn .9s cubic-bezier(.16,1,.3,1) both!important}
/* 6. quote: same centered image-first treatment as section 2 */
.my-v5-quote .art-col{width:min(88vw,520px)!important}
/* 7. deep: fully wine from top to bottom; four Polaroids never cover the text */
#deep.my-v5-page{background:#4A2732!important;color:#FADED2!important;isolation:isolate!important}
#deep.my-v5-page::before,#deep.my-v5-page::after{background:#4A2732!important;display:none!important}
#deep.my-v5-page .wrap{position:relative!important;z-index:20!important;width:min(760px,86vw)!important;margin:auto!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
#deep.my-v5-page .h-serif{color:#FADED2!important;text-align:center!important}
#deep.my-v5-page .body-copy{color:#FFF9F6!important;text-align:center!important;max-width:62ch!important}
#deep.my-v5-page .gold-script{color:#E8C66A!important;text-align:center!important}
.my-v5-polaroids{position:absolute!important;inset:0!important;z-index:5!important;pointer-events:none!important;overflow:hidden!important}
.my-v5-polaroid{position:absolute!important;width:clamp(92px,12vw,158px)!important;aspect-ratio:4/5!important;padding:7px 7px 30px!important;background:#fffaf7!important;border-radius:5px!important;box-shadow:0 18px 38px rgba(15,3,8,.34)!important;overflow:hidden!important}
.my-v5-polaroid img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important}
.my-v5-polaroid:after{content:'♡';position:absolute;left:0;right:0;bottom:4px;text-align:center;font:18px/1 'Great Vibes',cursive;color:#b86f7e!important}
.my-v5-polaroid.p1{left:2%;top:13%;transform:rotate(-7deg)!important}.my-v5-polaroid.p2{right:2%;top:13%;transform:rotate(7deg)!important}.my-v5-polaroid.p3{left:2%;bottom:13%;transform:rotate(6deg)!important}.my-v5-polaroid.p4{right:2%;bottom:13%;transform:rotate(-6deg)!important}
@media(max-width:760px){.my-v5-polaroid{width:clamp(78px,21vw,108px)!important;padding:5px 5px 24px!important}.my-v5-polaroid.p1{left:0;top:8%}.my-v5-polaroid.p2{right:0;top:8%}.my-v5-polaroid.p3{left:0;bottom:8%}.my-v5-polaroid.p4{right:0;bottom:8%}.my-v5-page .my-v5-continue{bottom:18px!important;min-width:220px!important;min-height:62px!important}}
/* 8. final: preserve its existing Let's Celebrate button exactly in this section */
#final.my-v5-page{padding-bottom:clamp(40px,7vh,90px)!important;text-align:center!important}
#final.my-v5-page .my-v5-continue{display:none!important}
#final.my-v5-page>.wrap{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
/* internal gift states */
.my-v5-gift.my-v5-state-gift #memory,.my-v5-gift.my-v5-state-gift #proposal{display:none!important}
.my-v5-gift.my-v5-state-memory #giftBlock,.my-v5-gift.my-v5-state-memory #proposal{display:none!important}
.my-v5-gift.my-v5-state-proposal #giftBlock,.my-v5-gift.my-v5-state-proposal #memory{display:none!important}
.my-v5-gift.my-v5-state-memory #memory{display:block!important}
.my-v5-gift.my-v5-state-proposal #proposal{display:block!important}
</style>
<script>
(function(){
  const q=(s,r=document)=>r.querySelector(s), qa=(s,r=document)=>Array.from(r.querySelectorAll(s));
  let installed=false, current=0, steps=[], backBtn=null, yesHandled=false;
  function text(el){return (el.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase()}
  function isContinue(el){return /continue/.test(text(el)) || el.classList.contains('page-next') || el.dataset.next!=null}
  function findContinue(sec){return qa('button,a,[role="button"]',sec).find(isContinue)||null}
  function cleanContinueArtifacts(){qa('.my-v5-continue').forEach(b=>b.classList.remove('my-v5-continue'));}
  function makeBack(){
    if(backBtn)return backBtn;
    backBtn=document.createElement('button');backBtn.type='button';backBtn.className='my-v5-back';backBtn.textContent='← Go back';
    backBtn.addEventListener('click',()=>{if(current>0)go(current-1,true)});document.body.appendChild(backBtn);return backBtn;
  }
  function updateBack(){if(current===0){if(backBtn)backBtn.style.display='none'}else{makeBack().style.display='block'}}
  function setActive(step){
    steps.forEach((s,i)=>{if(s.page){s.page.classList.toggle('my-v5-active',i===step);s.page.setAttribute('aria-hidden',i===step?'false':'true')}});
    const s=steps[step];
    if(s.page) s.page.scrollTop=0;
    if(s.state){s.page.classList.remove('my-v5-state-gift','my-v5-state-memory','my-v5-state-proposal');s.page.classList.add('my-v5-state-'+s.state)}
    qa('.rv',s.page||document).forEach(el=>el.classList.add('rv-in'));
    updateBack();window.scrollTo(0,0);
  }
  function go(step,push){
    if(!steps.length)return;
    current=Math.max(0,Math.min(step,steps.length-1));setActive(current);
    if(push)history.pushState({v5:current},'',current?('#part-'+(current+1)):location.pathname+location.search);
  }
  function moveButton(btn,target){
    if(!btn||!target)return;
    btn.classList.add('my-v5-continue');btn.removeAttribute('style');btn.setAttribute('type','button');target.appendChild(btn);
  }
  function setupImages(){
    const love=q('.my-v5-love .art-frame');
    if(love){let img=q('img',love);if(!img){img=document.createElement('img');love.appendChild(img)}img.src='assets/scratch-photo.jpg?v=myyellow-v5';img.alt='A cherished photo';}
    const memory=q('#memoryCard .memory-frame');
    if(memory){let img=q('img',memory);if(!img){img=document.createElement('img');memory.appendChild(img)}img.src='assets/file_000000004ab482088a7d776c072c4951.png?v=myyellow-v5';img.alt='A cherished memory';}
  }
  function setupPolaroids(deep){
    if(q('.my-v5-polaroids',deep))return;
    const box=document.createElement('div');box.className='my-v5-polaroids';
    [['03.jpg','p1'],['07.jpg','p2'],['08.jpg','p3'],['IMG_20260730_235824.png','p4']].forEach((a)=>{const f=document.createElement('figure');f.className='my-v5-polaroid '+a[1];const img=document.createElement('img');img.src='assets/'+encodeURIComponent(a[0])+'?v=myyellow-v5';img.alt='Memory';f.appendChild(img);box.appendChild(f)});
    deep.appendChild(box);
  }
  function setupYes(){
    const yes=q('#btnYes');if(!yes||yes.dataset.v5==='1')return;
    const fresh=yes.cloneNode(true);yes.replaceWith(fresh);fresh.dataset.v5='1';
    fresh.addEventListener('click',()=>{
      if(yesHandled)return;yesHandled=true;
      const card=q('#yesCard'),cat=q('#cat');
      if(card){card.style.display='block';card.classList.remove('my-v5-yes-card-in');void card.offsetWidth;card.classList.add('my-v5-yes-card-in')}
      if(window.Cat&&typeof window.Cat.centerThanks==='function')window.Cat.centerThanks();
      if(typeof window.floatHearts==='function'){try{window.floatHearts(34,{spreadDelay:1.8})}catch(e){}}
      if(typeof window.flashGlow==='function'){try{window.flashGlow(.85,620,900,1400)}catch(e){}}
      setTimeout(()=>{if(card){card.classList.remove('my-v5-yes-card-in');card.style.display='block'}},4600);
      setTimeout(()=>{yesHandled=false;fresh.disabled=false;go(current+1,true)},5000);
    });
  }
  function install(){
    const world=q('#viewStory #world');if(!world)return false;
    const pages=qa(':scope>section',world);if(pages.length<6)return false;
    world.classList.add('my-v5-world');
    pages.forEach(p=>p.classList.add('my-v5-page'));
    const hero=pages[0],love=pages[1],gift=pages[2],quote=pages[3],deep=pages[4],final=pages[5];
    love.classList.add('my-v5-love');gift.classList.add('my-v5-gift');quote.classList.add('my-v5-quote');
    /* We keep the original six sections, but the gift section becomes three private pages. */
    const originalGiftContinue=findContinue(gift);
    const heroContinue=findContinue(hero),loveContinue=findContinue(love),quoteContinue=findContinue(quote),deepContinue=findContinue(deep);
    cleanContinueArtifacts();
    setupImages();setupPolaroids(deep);
    /* Build step list: hero → love → gift → memory → proposal → quote → deep → final. */
    steps=[
      {page:hero},
      {page:love},
      {page:gift,state:'gift'},
      {page:gift,state:'memory'},
      {page:gift,state:'proposal'},
      {page:quote},
      {page:deep},
      {page:final}
    ];
    /* One existing Continue button is moved to the end of each real section. No new Continue buttons. */
    if(heroContinue)moveButton(heroContinue,q('#heroInner',hero)||hero);
    if(loveContinue)moveButton(loveContinue,q('.stack',love)||love);
    if(originalGiftContinue)moveButton(originalGiftContinue,q('.wrap',gift)||gift);
    if(quoteContinue)moveButton(quoteContinue,q('.stack',quote)||quote);
    if(deepContinue)moveButton(deepContinue,q('.wrap',deep)||deep);
    /* Final section keeps its existing Let's Celebrate button. */
    if(findContinue(final))findContinue(final).style.display='none';
    /* Re-use the same gift Continue button for gift → memory → proposal → quote. */
    const giftNext=originalGiftContinue;
    if(giftNext){
      giftNext.addEventListener('click',e=>{
        e.preventDefault();e.stopImmediatePropagation();
        if(current===2){go(3,true);setTimeout(()=>{gift.classList.add('my-v5-state-memory')},20)}
        else if(current===3){go(4,true);setTimeout(()=>{gift.classList.add('my-v5-state-proposal')},20)}
        else if(current===4){go(5,true)}
      },true);
    }
    /* Prevent the original gift interactions from changing the whole story. */
    const giftEl=q('#gift',gift);if(giftEl)giftEl.addEventListener('click',()=>{gift.classList.add('my-v5-state-gift')},true);
    const memoryCard=q('#memoryCard',gift);if(memoryCard)memoryCard.addEventListener('click',()=>{gift.classList.add('my-v5-state-memory')},true);
    setupYes();
    if(world.dataset.myV5Installed==='1')return true;
    world.dataset.myV5Installed='1';installed=true;
    const hash=location.hash.match(/part-(\\d+)/);go(hash?Math.min(parseInt(hash[1],10)-1,steps.length-1):0,false);
    return true;
  }
  let tries=0;const timer=setInterval(()=>{tries++;if(install()||tries>150)clearInterval(timer)},80);
  window.addEventListener('popstate',()=>{const m=location.hash.match(/part-(\\d+)/);go(m?Math.min(parseInt(m[1],10)-1,steps.length-1):0,false)});
})();
<\\/script>`;
    html=html.replace(/<\\/body>/i,patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(error){console.error(error);document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;font:16px system-ui;color:#4A2732;background:#FADED2">One moment 💗</main>'}
})();
</script>
</body>
</html>
