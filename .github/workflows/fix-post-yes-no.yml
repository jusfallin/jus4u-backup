name: Fix post-YES NO interaction
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only the post-YES NO handler
        shell: python
        run: |
          from pathlib import Path
          p = Path('api/final-flow-fix.js')
          s = p.read_text(encoding='utf-8')

          old_click = """    document.addEventListener('click',function(e){\n      var no=e.target&&e.target.closest?e.target.closest('#btnNo'):null;\n      if(no)hideContinue();\n    },true);"""
          new_click = """    document.addEventListener('click',function(e){\n      var no=e.target&&e.target.closest?e.target.closest('#btnNo'):null;\n      if(!no)return;\n      /* After YES is pressed, NO is inert: it must not hide Continue or restart the cat. */\n      var yes=document.getElementById('btnYes');\n      if(yes && yes.disabled){\n        e.preventDefault();\n        e.stopImmediatePropagation();\n        return;\n      }\n      hideContinue();\n    },true);"""

          old_touch = """    document.addEventListener('touchend',function(e){\n      var no=e.target&&e.target.closest?e.target.closest('#btnNo'):null;\n      if(no)hideContinue();\n    },{capture:true,passive:false});"""
          new_touch = """    document.addEventListener('touchend',function(e){\n      var no=e.target&&e.target.closest?e.target.closest('#btnNo'):null;\n      if(!no)return;\n      /* After YES is pressed, NO is inert: it must not hide Continue or restart the cat. */\n      var yes=document.getElementById('btnYes');\n      if(yes && yes.disabled){\n        e.preventDefault();\n        e.stopImmediatePropagation();\n        return;\n      }\n      hideContinue();\n    },{capture:true,passive:false});"""

          if old_click not in s:
              raise SystemExit('Click patch target not found; refusing to change anything.')
          if old_touch not in s:
              raise SystemExit('Touch patch target not found; refusing to change anything.')

          s = s.replace(old_click, new_click, 1)
          s = s.replace(old_touch, new_touch, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/final-flow-fix.js
          git commit -m 'Fix NO button after YES' || true
          git rm -f .github/workflows/fix-post-yes-no.yml || true
          git commit -m 'Remove temporary post-YES fix workflow' || true
          git push
# trigger workflow on merge
