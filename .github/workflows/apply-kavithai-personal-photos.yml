name: Apply Kavithai personal photos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup project
        uses: actions/checkout@v4

      - name: Copy the five requested photos from the correct source repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 -o assets/01.jpg 'https://raw.githubusercontent.com/jusfallin/jus4u./main/assets/01.jpg'
          curl -L --fail --retry 3 -o assets/02.jpg 'https://raw.githubusercontent.com/jusfallin/jus4u./main/assets/02.jpg'
          curl -L --fail --retry 3 -o assets/03.jpg 'https://raw.githubusercontent.com/jusfallin/jus4u./main/assets/03.jpg'
          curl -L --fail --retry 3 -o assets/13.jpg 'https://raw.githubusercontent.com/jusfallin/jus4u./main/assets/13.jpg'
          curl -L --fail --retry 3 -o assets/IMG_20260730_235824.png 'https://raw.githubusercontent.com/jusfallin/jus4u./main/assets/IMG_20260730_235824.png'

      - name: Patch only the five Kavithai cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('website file.html')
          text = path.read_text(encoding='utf-8')

          images = '''<script>
          /* Correct five personal photos for the Kavithai cards. */
          var KAVITHAI_IMAGES=["01.jpg","02.jpg","03.jpg","13.jpg","IMG_20260730_235824.png"];
          </script>'''

          if 'var KAVITHAI_IMAGES=' not in text:
              text = text.replace('</head>', images + '\n</head>', 1)

          replacement = '''function lart(i){
            var src=KAVITHAI_IMAGES[i]||KAVITHAI_IMAGES[0];
            return '<img class="kavithai-photo" src="assets/'+encodeURIComponent(src)+'" alt="Kavithai '+String(i+1).padStart(2,'0')+' — cherished memory" loading="eager" decoding="async">';
          }'''

          pattern = re.compile(r'function\\s+lart\\s*\\(\\s*i\\s*\\)\\s*\\{.*?\\n\\s*\\}', re.S)
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not find the Kavithai lart(i) renderer; no HTML change made.')

          css = '''<style id="kavithai-personal-photo-treatment">
          /* Personal-photo treatment for the five Kavithai cards only. */
          .poem .art-card{
            border-width:clamp(10px,1.2vw,17px);
            border-radius:15px;
            background:linear-gradient(145deg,#fffdfb,#fff7f2);
            box-shadow:0 34px 68px -34px rgba(74,39,50,.48),0 8px 20px -12px rgba(74,39,50,.22);
            transition:box-shadow .5s ease,transform .5s cubic-bezier(.2,.8,.24,1)
          }
          .poem .art-frame{
            aspect-ratio:4/5;
            border-radius:7px;
            background:#f2ddd6;
            isolation:isolate
          }
          .poem .art-frame::after{
            content:"";
            position:absolute;
            inset:0;
            z-index:2;
            pointer-events:none;
            background:linear-gradient(180deg,rgba(255,249,246,.08),rgba(74,39,50,0) 58%,rgba(74,39,50,.10)),linear-gradient(135deg,rgba(255,249,246,.16),transparent 42%)
          }
          .kavithai-photo{
            position:relative!important;
            z-index:1!important;
            width:100%!important;
            height:100%!important;
            max-width:none!important;
            object-fit:cover!important;
            object-position:center!important;
            filter:saturate(.98) contrast(1.01);
            transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .6s ease;
            will-change:transform
          }
          .poem .tilt:hover .kavithai-photo{
            transform:scale(1.035);
            filter:saturate(1.04) contrast(1.02)
          }
          .poem .art-cap{
            padding:15px 10px 6px;
            font-size:clamp(20px,2vw,30px);
            text-shadow:0 1px 0 rgba(255,255,255,.7)
          }
          .poem .art-card::before{
            content:"♡";
            position:absolute;
            right:-12px;
            top:-14px;
            z-index:5;
            width:43px;
            height:43px;
            border-radius:50%;
            display:grid;
            place-items:center;
            background:linear-gradient(145deg,#f0b6c0,#dc97a5);
            color:#fff9f6;
            font:22px/1 var(--script);
            border:4px solid var(--cream);
            box-shadow:0 12px 24px -12px rgba(74,39,50,.45);
            transform:translateZ(44px);
            transition:transform .5s ease
          }
          .poem .tilt:hover .art-card::before{
            transform:translateZ(44px) rotate(10deg) scale(1.08)
          }
          @media(max-width:719px){
            .poem .art-card::before{right:-8px;top:-10px;width:38px;height:38px;font-size:20px}
            .poem .art-cap{padding-top:12px}
          }
          </style>'''

          if 'id="kavithai-personal-photo-treatment"' not in text:
              text = text.replace('</head>', css + '\n</head>', 1)

          path.write_text(text, encoding='utf-8')
          print('Patched Kavithai renderer and scoped photo styling.')
          PY

      - name: Verify exact assets and renderer
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/01.jpg
          test -s assets/02.jpg
          test -s assets/03.jpg
          test -s assets/13.jpg
          test -s assets/IMG_20260730_235824.png
          grep -F 'var KAVITHAI_IMAGES=["01.jpg","02.jpg","03.jpg","13.jpg","IMG_20260730_235824.png"];' 'website file.html'
          grep -F 'class="kavithai-photo"' 'website file.html'

      - name: Commit the requested change and remove this helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'website file.html' assets/01.jpg assets/02.jpg assets/03.jpg assets/13.jpg assets/IMG_20260730_235824.png
          git rm '.github/workflows/apply-kavithai-personal-photos.yml'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Apply Kavithai personal photos to myyellow'
          git push
