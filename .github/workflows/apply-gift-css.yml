name: Apply gift page styling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add gift stylesheet to generated page source
        shell: python
        run: |
          from pathlib import Path
          p = Path('website file.html')
          html = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="/assets/gift-page-overrides.css">'
          if marker not in html:
              html = html.replace('</head>', '  ' + marker + '\n</head>', 1)
              p.write_text(html, encoding='utf-8')

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-gift-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "website file.html" .github/workflows/apply-gift-css.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply gift page styling"
          git push
