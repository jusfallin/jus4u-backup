name: Import exact site snapshot

on:
  push:
    paths:
      - '.github/workflows/import-backup.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy current site from source repository
        run: |
          git clone --depth 1 https://github.com/jusfallin/jus4u..git /tmp/source
          rsync -a --delete --exclude '.git/' --exclude '.github/' /tmp/source/ ./
      - name: Commit exact snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Create exact backup snapshot from jus4u.' || echo 'No changes to commit'
          git push origin HEAD:main
