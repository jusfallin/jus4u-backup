name: Fix quote photo frame

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update quote photo frame without cropping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/website.js')
          s = p.read_text()
          old = 'body.my-page-flow #my-page-quote .art-frame{aspect-ratio:291/348!important;overflow:hidden!important}'
          new = 'body.my-page-flow #my-page-quote .art-frame{aspect-ratio:4/3!important;overflow:hidden!important;display:flex!important;align-items:center!important;justify-content:center!important;background:rgba(255,249,246,.5)!important}'
          assert old in s, 'quote frame rule not found'
          s = s.replace(old, new, 1)
          old2 = 'body.my-page-flow #my-page-quote .art-frame img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;border-radius:5px!important}'
          new2 = 'body.my-page-flow #my-page-quote .art-frame img{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important;border-radius:5px!important}'
          assert old2 in s, 'quote image rule not found'
          s = s.replace(old2, new2, 1)
          old3 = 'body.my-page-flow #my-page-quote .art-card{width:100%!important;padding:14px 14px 20px!important;box-shadow:0 24px 50px -28px rgba(110,55,70,.42)!important;transform:rotate(-1deg)!important;transition:transform .35s ease,box-shadow .35s ease!important}'
          new3 = 'body.my-page-flow #my-page-quote .art-card{width:100%!important;padding:14px 14px 20px!important;box-shadow:0 24px 50px -28px rgba(110,55,70,.42)!important;transform:rotate(-1deg)!important;transition:transform .35s ease,box-shadow .35s ease!important}'
          assert old3 in s, 'quote card rule not found'
          s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-quote-photo-frame.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/website.js .github/workflows/fix-quote-photo-frame.yml
          git commit -m 'Show full her image in rectangular frame' || exit 0
          git push
